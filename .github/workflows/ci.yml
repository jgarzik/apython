name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Everything the single LDFLAGS line in the Makefile links, not just the
      # two that used to be named here: -lz, -lcrypto and -lexpat happened to
      # be on the runner image, so nothing noticed they were missing from this
      # list until -lbz2 and -llzma were not.  The list matches the
      # Dependencies line in CLAUDE.md; keep the three in step.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libgmp-dev zlib1g-dev libbz2-dev \
            liblzma-dev libssl-dev libexpat1-dev libffi-dev

      - name: Build
        run: make

      - name: Test
        run: make check

      - name: CPython compatibility tests
        run: make check-cpython

      # The two gates that hand apython the .py instead of the .pyc, so our own
      # compiler produces the bytecode.  They are where most of the compiler's
      # bugs were found, and each ratchets against a recorded floor -- which
      # until now was only ever enforced when someone remembered to run it.
      - name: Source compiler, test corpus
        run: make check-source

      - name: Source compiler, CPython corpus
        run: make check-cpython-source
